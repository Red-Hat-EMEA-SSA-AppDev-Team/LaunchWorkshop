apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: logging
spec:
  type: Logging
  # Configuration for the logging console plugin.
  logging:
    # The LokiStack instance of which logs should be displayed.
    lokiStack:
      name: logging-loki
    # Max number of entries returned for a query
    logsLimit: 100
    # Maximum duration before a query timeout.
    timeout: 30s