apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  labels:
    build: cargo-app
  name: cargo-app
spec:
  failedBuildsHistoryLimit: 5
  output:
    to:
      kind: ImageStreamTag
      name: cargo-app:latest
  postCommit: {}
  resources: {}
  runPolicy: Serial
  source:
    binary: {}
    type: Binary
  strategy:
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: eap74-openjdk11-openshift-rhel8:latest
    type: Source
  successfulBuildsHistoryLimit: 5
