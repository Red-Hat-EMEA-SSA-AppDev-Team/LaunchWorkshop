apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    image.openshift.io/triggers: '[{ "from": { "kind":"ImageStreamTag", "name":"cargo-app:latest"},
      "fieldPath": "spec.template.spec.containers[?(@.name==\"cago-app-op\")].image"}]'
  name: cargo-app-state
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: cargo-app-state
      app.openshift.io/runtime: eap
  serviceName: cargo-app-state-headless
  template:
    metadata:
      annotations:
        alpha.image.policy.openshift.io/resolve-names: '*'
        wildfly.org/server-type: generic
      labels:
        app.kubernetes.io/name: cargo-app-state
        app.openshift.io/runtime: eap
        wildfly.org/operated-by-headless: active
        wildfly.org/operated-by-loadbalancer: active
    spec:
      containers:
      - env:
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: STATEFULSET_HEADLESS_SERVICE_NAME
          value: cago-app-state-headless
        image: cargo-app:latest
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - curl --fail http://127.0.0.1:9990/health/live
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: cargo-app-state
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9990
          name: admin
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/eap/standalone/data
          name: cargo-app-state-volume
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: cargo-app-state-volume
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
