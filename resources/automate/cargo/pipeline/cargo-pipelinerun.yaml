                  - '--loglevel=0'
                  - build
                  - ./target
                  - registry.redhat.io/jboss-eap-7/eap74-openjdk11-openshift-rhel8
                  - '--as-dockerfile'
                  - ./Dockerfile.gen
                computeResources: {}
                image: 'quay.io/openshift-pipeline/s2i:nightly'
                name: generate
                workingDir: /workspace/source
              - computeResources: {}
                image: 'quay.io/openshift-pipeline/s2i:nightly'
                name: sed
