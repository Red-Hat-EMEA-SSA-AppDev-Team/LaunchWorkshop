apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cargo-app-gitops
    app.kubernetes.io/component: cargo-app-gitops
    app.kubernetes.io/instance: cargo-app-gitops
    app.kubernetes.io/name: cargo-app-gitops
    app.openshift.io/runtime: cargo-app-gitops
    app.openshift.io/runtime-version: latest
  name: cargo-app-gitops
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicasCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cargo-app-gitops
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        alpha.image.policy.openshift.io/resolve-names: '*'
      labels:
        app: cargo-app-gitops
        deployment: cargo-app-gitops
    spec:
      containers:
      - image: cargo-app-gitops:latest
        imagePullPolicy: IfNotPresent
        name: cargo-app-gitops
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        - containerPort: 8778
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
